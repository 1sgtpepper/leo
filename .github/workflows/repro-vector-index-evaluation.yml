name: Vector index evaluation repro

on:
  push:
    branches:
      - repro/vector-index-evaluation
  workflow_dispatch:

permissions:
  contents: read

jobs:
  execution-repro:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.96.0
      - uses: Swatinem/rust-cache@v2
      - name: Generate current compiler evidence
        env:
          UPDATE_EXPECT: "1"
          TEST_FILTER: "storage/vector_index_evaluation_semantics.leo"
        run: cargo test --all --locked --features only_testnet -- test_compiler
      - name: Verify a clean rerun
        env:
          TEST_FILTER: "storage/vector_index_evaluation_semantics.leo"
        run: cargo test --all --locked --features only_testnet -- test_compiler
      - name: Publish observed output
        if: always()
        run: test -f tests/expectations/compiler/storage/vector_index_evaluation_semantics.out && sed -n '1,320p' tests/expectations/compiler/storage/vector_index_evaluation_semantics.out >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vector-index-evaluation-repro
          path: tests/expectations/compiler/storage/vector_index_evaluation_semantics.out
