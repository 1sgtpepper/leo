name: CLI O1 Reproducer

on:
  push:
    branches:
      - ci/cli-o1-repro

permissions:
  contents: read

jobs:
  reproducer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build CLI for isolated O1 reproducer
        run: cargo build --locked -p leo-lang --profile ci --features noconfig
      - name: Run isolated O1 reproducer
        run: bash ci/audit_o1.sh
      - name: Upload O1 reproducer logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: o1-reproducer-logs
          path: ${{ runner.temp }}/o1-artifacts
