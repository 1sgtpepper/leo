name: PR 29574 expectation

on:
  push:
    branches:
      - ci/pr-29574-expectation-v1

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.96.0

      - uses: Swatinem/rust-cache@v2

      - name: Install libclang
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libclang-dev

      - name: Update submodules
        run: git submodule update --init --recursive

      - name: Generate expectation
        env:
          UPDATE_EXPECT: 1
        run: cargo test -p leo-compiler execution_storage_pop_ternary_leo --locked -- --nocapture

      - name: Upload expectation
        uses: actions/upload-artifact@v4
        with:
          name: storage-pop-ternary-expectation
          path: tests/expectations/execution/storage_pop_ternary.out
