name: Compiler A1 Reproducer

on:
  push:
    branches:
      - ci/compiler-a1-repro

permissions:
  contents: read

jobs:
  reproducer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run isolated A1 reproducer
        run: cargo test --locked -p leo-compiler --test audit_a1 -- --nocapture
