name: Compiler F2 Reproducer

on:
  push:
    branches:
      - ci/compiler-f2-repro

permissions:
  contents: read

jobs:
  reproducer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run isolated F2 reproducer
        run: cargo test --locked -p leo-compiler --test audit_f2 -- --nocapture
