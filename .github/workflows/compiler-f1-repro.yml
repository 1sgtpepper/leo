name: Compiler F1 Reproducer

on:
  push:
    branches:
      - ci/compiler-f1-repro

permissions:
  contents: read

jobs:
  reproducer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run isolated F1 reproducer
        run: cargo test --locked -p leo-compiler --lib test_compiler::audit_f1_module_qualified_interface_record -- --nocapture
