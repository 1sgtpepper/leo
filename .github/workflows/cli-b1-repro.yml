name: CLI B1 Reproducer

on:
  push:
    branches:
      - ci/cli-b1-repro

permissions:
  contents: read

jobs:
  reproducer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build CLI for isolated B1 reproducer
        run: cargo build --locked -p leo-lang --profile ci --features noconfig
      - name: Run isolated B1 reproducer
        run: bash ci/audit_b1.sh
      - name: Upload B1 reproducer logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: b1-reproducer-logs
          path: ${{ runner.temp }}/b1-artifacts
